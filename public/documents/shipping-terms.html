<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Условия отгрузки</title>
    <style>
      @font-face { font-family: Manrope; src: url("../fonts/manrope-400.ttf") format("truetype"); font-weight: 400; font-display: swap; } @font-face { font-family: Manrope; src: url("../fonts/manrope-700.ttf") format("truetype"); font-weight: 700; font-display: swap; }
      body { margin: 0; font-family: Manrope, "Segoe UI", sans-serif; color: #2d2926; background: #f2ede3; }
      main { width: min(920px, calc(100% - 32px)); margin: 36px auto; padding: 36px; background: #fffdf8; border: 1px solid #d8cdbc; }
      h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.05; }
      p, li { color: #706963; line-height: 1.55; }
      ol { margin-top: 24px; padding-left: 22px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Условия отгрузки</h1>
      <p>Порядок согласования поставки автомобильным и железнодорожным транспортом.</p>
      <ol>
        <li>уточнение продукта, фракции и объема партии;</li>
        <li>выбор автомобильной или железнодорожной схемы;</li>
        <li>согласование графика и станции клиента;</li>
        <li>подготовка паспорта качества и документов по партии.</li>
      </ol>
    </main>
  </body>
</html>
